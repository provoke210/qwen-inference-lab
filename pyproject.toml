[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-inference-lab"
version = "0.1.0"
description = "Independent Qwen3 inference core with paged KV storage and request scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "safetensors>=0.4"]

[project.optional-dependencies]
text = ["transformers>=4.51,<5"]
test = ["pytest>=8,<9", "transformers==4.55.2"]

[project.scripts]
qil = "qil.__main__:main"

[tool.setuptools.packages.find]
include = ["qil", "qil.*"]

[tool.pytest.ini_options]
testpaths = ["tests/qil"]
